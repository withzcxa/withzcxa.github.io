<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>with.loc.cc · xiao 的小站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #e6e6fa; text-align: center; padding: 24px;
  }
  .card {
    max-width: 560px; padding: 48px 36px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 20px; backdrop-filter: blur(8px);
  }
  h1 {
    font-size: 2.2rem; margin-bottom: 12px;
    background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { line-height: 1.8; color: #c7c9e8; margin-bottom: 10px; }
  a.btn {
    display: inline-block; margin-top: 18px; padding: 10px 26px;
    border-radius: 999px; text-decoration: none; color: #fff;
    background: linear-gradient(90deg, #7c3aed, #2563eb);
  }
  a.btn:hover { opacity: 0.85; }
  footer { margin-top: 26px; font-size: 0.85rem; color: #8b8fb8; }
</style>
</head>
<body>
  <main class="card">
    <h1>with.loc.cc</h1>
    <p>你好，我是 xiao，一名在校大学生。</p>
    <p>这里是我的个人小站，记录学习、代码与折腾的日常。</p>
    <a class="btn" href="https://github.com/withzcxa">访问我的 GitHub 主页</a>
    <footer>© 2026 withzcxa · Hosted on GitHub Pages</footer>
  </main>
</body>
</html>
